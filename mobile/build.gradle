apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def pifiSigningProperties = new Properties()
def pifiSigningPropertiesFile = new File(System.getProperty('user.home'), '.config/aw-android-pifi/signing.properties')
if (!pifiSigningPropertiesFile.isFile()) {
    throw new GradleException("Missing private Pifi signing config: ${pifiSigningPropertiesFile}")
}
pifiSigningPropertiesFile.withInputStream { pifiSigningProperties.load(it) }

android {
    compileSdk 36

    defaultConfig {
        applicationId "net.activitywatch.android"
        minSdkVersion 26
        targetSdkVersion 36

        // Keep versionName committed in source so tagged builds and F-Droid agree.
        // Tag workflows verify it matches refs/tags/v* instead of rewriting the checkout.
        versionName '0.14.4b1'

        // Set in CI by `bundle exec fastlane update_version`
        versionCode 49

        // Default server port; overridden per product flavor below. Threaded
        // through BuildConfig so a "research" build can run side by side with
        // a normal install without contending for the same port.
        buildConfigField "int", "SERVER_PORT", "5600"
        buildConfigField "String", "REMOTE_SERVER_URL", '"http://pifi.tail1b960.ts.net:5600"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // NOTE: This only works for API level 28 and above
        //testInstrumentationRunnerArguments useTestStorageService: 'true'

        // WARNING: Never commit this uncommented! (leads to huge APKs)
        //packagingOptions {
        //    doNotStrip '**/*.so'
        //}
    }
    flavorDimensions "distribution"
    signingConfigs {
        pifiRelease {
            storeFile file(pifiSigningProperties.getProperty('storeFile'))
            storePassword pifiSigningProperties.getProperty('storePassword')
            keyAlias pifiSigningProperties.getProperty('keyAlias')
            keyPassword pifiSigningProperties.getProperty('keyPassword')
        }
    }
    productFlavors {
        standard {
            dimension "distribution"
        }
        research {
            dimension "distribution"
            // Own applicationId + port so a study participant's existing
            // ActivityWatch install (own bundle id, own data dir, port 5600)
            // is untouched by the research build (ethics-approval requirement:
            // ActivityWatch/aw-android research flavor spec).
            applicationIdSuffix ".research"
            versionNameSuffix "-research"
            buildConfigField "int", "SERVER_PORT", "5667"
            resValue "string", "app_name", "ActivityWatch Research"
        }
        pifi {
            dimension "distribution"
            applicationIdSuffix ".pifi"
            versionNameSuffix "-pifi"
            resValue "string", "app_name", "ActivityWatch Pifi"
        }
    }
    buildTypes {
        release {
            // Run R8: Play flags releases whose DEX optimization is below
            // its threshold ("Bad behavior -> DEX code optimization", #268).
            // Keep rules for everything reached by name at runtime (
            // @JavascriptInterface, WorkManager, reflective fragments) live
            // in mobile/proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.pifiRelease
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'net.activitywatch.android'
    // Never got this to work...
    if (project.hasProperty("doNotStrip")) {
        println "Configuring doNotStrip for jniLibs"
        packaging {
            jniLibs {
                keepDebugSymbols += "**/*.so"
            }
        }
    }

    // Creates a resource versionName with the full version
    // https://stackoverflow.com/a/36468650/965332
    applicationVariants.all { variant ->
        variant.resValue "string", "versionName", 'v' + variant.versionName
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packaging {
        dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.webkit:webkit:1.12.1'

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'

    testImplementation "junit:junit:4.13.2"
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.work:work-testing:2.9.1'
    androidTestImplementation "androidx.test.ext:junit-ktx:$extJUnitVersion"
    androidTestImplementation "androidx.test:runner:$androidXTestVersion"
    androidTestImplementation "androidx.test:rules:$androidXTestVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoVersion"
    androidTestUtil "androidx.test.services:test-services:$servicesVersion"
    androidTestImplementation "androidx.test.espresso:espresso-web:$espressoVersion"
    androidTestImplementation "androidx.browser:browser:1.8.0"
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation('org.awaitility:awaitility:4.3.0') {
        exclude group: 'org.hamcrest', module: 'hamcrest'
    }

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
